[package]
name = "tiny-agent"
version = "0.1.0"
edition = "2021"
description = "A native, in-memory coding-agent SDK with streaming providers and JSONL RPC."

[dependencies]
bytes = "=1.12.1"
futures-util = { version = "=0.3.32", default-features = false, features = ["std", "async-await"] }
http-body-util = "=0.1.5"
hyper = { version = "=1.11.0", features = ["http1", "server"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
jsonschema = { version = "=0.30.0", default-features = false }
mime = "=0.3.17"
reqwest = { version = "=0.12.28", features = ["json", "stream"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
subtle = "=2.6.1"
tokio = { version = "=1.53.1", features = ["io-util", "io-std", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
uuid = { version = "=1.25.0", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["process", "signal"] }

[[bin]]
name = "tiny-agent"
path = "tiny_agent.rs"

[[example]]
name = "rpc_fixture"
path = "testdata/rpc.rs"
