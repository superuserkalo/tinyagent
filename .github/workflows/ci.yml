name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12", "3.14"]
    defaults:
      run:
        working-directory: tinyagents/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e .
      - name: Test
        run: python -m unittest discover -p 'test_*.py'
      - name: CLI self-test
        run: python tiny_agent.py --self-test
      - name: Tests leave the checkout clean
        run: git diff --exit-code && test -z "$(git status --porcelain)"

  typescript:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["22", "24"]
    defaults:
      run:
        working-directory: tinyagents/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install
        run: npm ci --ignore-scripts
      - name: Type check
        run: npm run check
      - name: Test
        run: npm test
      - name: CLI self-test
        run: node tiny_agent.ts --self-test
      - name: HTML builder demo, kill and resume
        run: node --test ../../examples/html-builder/kill_resume.test.ts
      - name: Tests leave the checkout clean
        run: git diff --exit-code && test -z "$(git status --porcelain)"

  conformance:
    name: Shared conformance (Python and TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e ./tinyagents/python
      - run: npm ci --ignore-scripts
        working-directory: tinyagents/typescript
      - run: python conformance/run.py python typescript

  blackbox:
    name: Black-box harness, quick (Python and TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e ./tinyagents/python
      - run: npm ci --ignore-scripts
        working-directory: tinyagents/typescript
      - run: python conformance/blackbox/run.py python typescript --quick
